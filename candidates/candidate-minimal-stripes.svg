<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d0c" />
      <stop offset="50%" stop-color="#0d1513" />
      <stop offset="100%" stop-color="#070b0a" />
    </linearGradient>

    <!-- Subtle Red Core Glow -->
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Gold Accent Glow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tarmac / Grid texture pattern -->
    <pattern id="tarmac-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.018" />
    </pattern>
  </defs>

  <!-- Deep Tarmac Background -->
  <rect width="3840" height="2160" fill="url(#bg-grad)" />
  <rect width="3840" height="2160" fill="url(#tarmac-grid)" />

  <!-- Subtle Bertone Wedge Geometric Watermark Silhouette in Background -->
  <g opacity="0.035" transform="translate(180, 260) scale(1.6)">
    <!-- Low-slung Gandini wedge outline -->
    <polygon points="100,500 280,380 620,380 820,440 980,450 1020,500 90,500" fill="#ffffff" />
    <circle cx="280" cy="500" r="70" fill="#080d0c" stroke="#ffffff" stroke-width="12" />
    <circle cx="820" cy="500" r="75" fill="#080d0c" stroke="#ffffff" stroke-width="12" />
  </g>

  <!-- Alitalia Diagonal Livery Band & Arrow Motif -->
  <!-- Rake angle matches the legendary Bertone wedge nose: -28 degrees -->
  <g transform="rotate(-28 1920 1080)">
    <!-- Campagnolo Gold Lead Pinstripe -->
    <rect x="-1200" y="930" width="6200" height="10" fill="#d4af37" opacity="0.9" filter="url(#gold-glow)" />

    <!-- Alitalia Emerald Green outer ribbon -->
    <rect x="-1200" y="955" width="6200" height="42" fill="#008c45" opacity="0.96" />
    
    <!-- Crisp Rally White separator -->
    <rect x="-1200" y="997" width="6200" height="16" fill="#ffffff" />

    <!-- Alitalia Scarlet Red central chevron band -->
    <rect x="-1200" y="1013" width="6200" height="66" fill="#d9232e" filter="url(#red-glow)" />

    <!-- Crisp Rally White separator -->
    <rect x="-1200" y="1079" width="6200" height="16" fill="#ffffff" />

    <!-- Alitalia Emerald Green outer ribbon -->
    <rect x="-1200" y="1095" width="6200" height="42" fill="#008c45" opacity="0.96" />

    <!-- Campagnolo Gold Trailing Pinstripe -->
    <rect x="-1200" y="1150" width="6200" height="10" fill="#d4af37" opacity="0.9" filter="url(#gold-glow)" />

    <!-- Signature Alitalia Arrowhead Cutout Wedge Motif -->
    <polygon points="2700,900 2950,1046 2700,1192 2580,1192 2810,1046 2580,900" fill="#ffffff" opacity="0.85" />
    <polygon points="2730,920 2930,1046 2730,1172 2650,1172 2830,1046 2650,920" fill="#008c45" opacity="0.95" />
    <polygon points="2760,950 2900,1046 2760,1142 2710,1142 2830,1046 2710,950" fill="#d9232e" />
  </g>

  <!-- Top-Left Subtle Technical Telemetry -->
  <g transform="translate(140, 140)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#008c45" letter-spacing="4" opacity="0.85">LANCIA REPARTO CORSE • HOMOLOGATION FIA GR.4 #643</text>
    <text x="0" y="28" font-family="monospace" font-size="13" fill="#d4af37" letter-spacing="3" opacity="0.75">FERRARI DINO 246 V6 • 2418 CC • 275 BHP @ 7800 RPM</text>
  </g>

  <!-- Bottom-Right Hero Typography & Sandro Munari Tribute Badge -->
  <g transform="translate(3660, 1960)">
    <!-- Livery Accent Micro Bar -->
    <rect x="-640" y="-140" width="640" height="4" fill="#008c45" />
    <rect x="-420" y="-140" width="220" height="4" fill="#ffffff" />
    <rect x="-220" y="-140" width="220" height="4" fill="#d9232e" />

    <!-- Title Header -->
    <text x="0" y="-85" text-anchor="end" font-family="sans-serif" font-weight="900" font-size="48" fill="#ffffff" letter-spacing="8" opacity="0.95">LANCIA STRATOS HF</text>
    
    <!-- Subtitle with Campagnolo Gold highlight -->
    <text x="0" y="-45" text-anchor="end" font-family="sans-serif" font-weight="700" font-size="22" fill="#d4af37" letter-spacing="10" opacity="0.95">ALITALIA GROUP 4 • CAR #1</text>
    
    <!-- Sandro Munari Monte Carlo Tribute Easter-Egg -->
    <text x="0" y="-10" text-anchor="end" font-family="monospace" font-weight="600" font-size="14" fill="#12a153" letter-spacing="4" opacity="0.85">PILOT: SANDRO MUNARI &quot;IL DRAGO&quot; • CO-PILOT: SILVIO MAIGA</text>
    <text x="0" y="16" text-anchor="end" font-family="monospace" font-weight="500" font-size="13" fill="#ffffff" letter-spacing="3" opacity="0.6">🏆 RALLYE MONTE-CARLO WINNER: 1975 • 1976 • 1977 [HAT-TRICK]</text>
  </g>
</svg>
